<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#1a1b26">
  <title>Herdr</title>
  <!-- v0.9.8.7: the font starts loading with the stylesheet instead of after it. -->
  <link rel="preload" href="InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <!-- The live Omarchy theme colours from the server; style.css holds the Tokyo Night fallback. -->
  <link rel="stylesheet" href="theme.css" id="theme-css">
</head>
<body>
  <svg class="icon-sprite" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute"><defs>
  <symbol id="i-graph" viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 8.5l3 7M16.5 8l-3.5 7.5M8.5 7h7"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0112 0c0 6 2.5 7 2.5 7h-17S6 15 6 9zM10 20a2 2 0 004 0"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></symbol>
  <symbol id="i-hand" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1.1-1.5 2M12 17h.01"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 4l1.8 4.7L18.5 10.5l-4.7 1.8L12 17l-1.8-4.7L5.5 10.5l4.7-1.8zM18.5 16v3M17 17.5h3"/></symbol>
  <symbol id="i-term" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M7 10l3 2-3 2M12.5 14.5H16"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 6h14a1.5 1.5 0 011.5 1.5v8A1.5 1.5 0 0119 17h-7l-4.5 3v-3H5a1.5 1.5 0 01-1.5-1.5v-8A1.5 1.5 0 015 6z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.5"/><path d="M5.5 19.5a6.5 6.5 0 0113 0"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.5"/></symbol>
  <symbol id="i-pr" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="18" r="2.2"/><path d="M6 8.2v7.6M18 15.8V10a3 3 0 00-3-3h-3M13.5 4.5L11 7l2.5 2.5"/></symbol>
  <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4 17a8 8 0 1116 0M12 17l4-5M7 17h.01M17 17h.01"/></symbol>
  <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V5.5A1.5 1.5 0 015.5 4H9M15 4h3.5A1.5 1.5 0 0120 5.5V9M20 15v3.5a1.5 1.5 0 01-1.5 1.5H15M9 20H5.5A1.5 1.5 0 014 18.5V15"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4.5l8.5 14.5h-17zM12 10v4M12 16.8h.01"/></symbol>
  <symbol id="i-visuals" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="11" r="1.6"/><path d="M7 17l3.5-3.5 2.5 2.5 2.2-2.2L20 16.5"/></symbol>
</defs></svg>
  <header class="topbar">
    <a class="brand" href="#" data-route="home">Herdr</a>
    <span id="fresh" class="fresh" role="status"></span>
    <a class="visuals-entry" href="#" data-route="visuals" aria-label="Visuals" title="Visuals"><svg class="i" aria-hidden="true"><use href="#i-visuals"/></svg><span id="visuals-badge" class="tab-badge visuals-badge" hidden></span></a>
    <span class="quota-slot" data-quota-chip><a class="chip quota-chip" href="#" data-route="quotas">Quotas</a></span>
  </header>

  <nav id="tabbar" class="tabbar" aria-label="Main">
    <a class="tab" data-tab="graph" href="#" data-route="home"><svg class="i" aria-hidden="true"><use href="#i-graph"/></svg><span>Graph</span></a>
    <a class="tab" data-tab="overview" href="#" data-route="list"><svg class="i" aria-hidden="true"><use href="#i-list"/></svg><span>List</span></a>
    <a class="tab" data-tab="notifications" href="#" data-route="notifications"><svg class="i" aria-hidden="true"><use href="#i-bell"/></svg><span>Notifications</span><span id="notif-badge" class="tab-badge" hidden></span></a>
    <a class="tab" data-tab="quotas" href="#" data-route="quotas"><svg class="i" aria-hidden="true"><use href="#i-gauge"/></svg><span>Quotas</span></a>
    <a class="tab" data-tab="settings" href="#" data-route="settings"><svg class="i" aria-hidden="true"><use href="#i-gear"/></svg><span>Settings</span></a>
  </nav>

  <div id="banner" class="banner" hidden></div>
  <aside id="reply-deliveries" class="reply-deliveries" aria-label="Reply delivery" hidden></aside>
  <div id="visual-toasts" class="visual-toasts" aria-live="polite"></div>

  <main id="app" tabindex="-1">
    <p class="loading">Loading…</p>
  </main>

  <section id="login" class="login" hidden>
    <h1>Herdr</h1>
    <p class="muted">Your agents, at a glance. Log in to continue.</p>
    <form id="login-form">
      <label for="passphrase">Passphrase</label>
      <input id="passphrase" type="password" autocomplete="current-password" required>
      <button type="submit" class="btn primary">Log in</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <script src="ui-contract.js"></script>
  <script src="graph.js"></script>
  <script src="terminal.js"></script>
  <script src="details.js"></script>
  <script src="app.js"></script>
</body>
</html>
